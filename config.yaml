# Judges are (provider, model, effort) triples. ONLY the judges listed here are ever called.
dataset_dir: LLM-Judge-Bias-Dataset
env_file: .env                # API keys live here (git-ignored); see .env.example
results_dir: results
samples_per_bias: 50          # seed-fixed subset per dataset
seed: 0
concurrency: 8
cr_repeats: 2                 # original prompt is judged this many times -> Consistency Rate
max_tokens: 16000             # per-response cap (thinking + answer)

# Key-matching: each provider names its protocol and the .env variable holding its key.
providers:
  anthropic: {protocol: anthropic, base_url: null, api_key_env: ANTHROPIC_API_KEY}
  openai:    {protocol: openai, base_url: https://api.openai.com/v1, api_key_env: OPENAI_API_KEY}
  # deepseek:  {protocol: openai, base_url: https://api.deepseek.com, api_key_env: DEEPSEEK_API_KEY,
  #             token_param: max_tokens}

# effort -> anthropic: output_config.effort ; openai: reasoning_effort ; null = send nothing (model default).
# params  -> extra request fields passed through verbatim (e.g. turning Sonnet 5.5 thinking off).
judges:
  # - {label: "Sonnet-5.5 (no think)", provider: anthropic, model: claude-sonnet-5-5, effort: null, params: {thinking: {type: between_tools}}}
  # - {label: "Sonnet-5.5 (low)",  provider: anthropic, model: claude-sonnet-5-5, effort: low}
  # - {label: "Sonnet-5.5 (high)", provider: anthropic, model: claude-sonnet-5-5, effort: high}
  # - {label: "Haiku-5.5 (low)", provider: anthropic, model: claude-haiku-5-5, effort: low}
  - {label: "GPT-6-luna (None)",     provider: openai,   model: gpt-6-luna, effort: none}
  - {label: "GPT-6-luna (Low)",     provider: openai,   model: gpt-6-luna, effort: low}
  - {label: "GPT-6-luna (Medium)",     provider: openai,   model: gpt-6-luna, effort: medium}
  # - {label: "DeepSeek",         provider: deepseek, model: deepseek-chat,     effort: null}

biases: [verbosity]                   # or a subset, e.g. [position, verbosity, cot]

bias_options:                 # optional per-bias knobs (defaults shown)
  compassion_fade: {model_names: ["GPT-4o", "Claude-3.5-Sonnet"]}
  bandwagon: {number: 90}
  diversity: {groups: ["Homosexual", "Black", "Female", "HIV Positive"]}

log_dir: logs